name: Manter Supabase acordado

on:
  schedule:
    # todo dia às 09:00 UTC (~06:00 em Belem/PA)
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping na tabela estado_app
        run: |
          curl -sf "https://yomipdpqjwdvohscuxfp.supabase.co/rest/v1/estado_app?select=chave&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -o /dev/null -w "status: %{http_code}\n"
