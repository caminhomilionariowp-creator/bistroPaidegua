name: Deploy para Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          # Chaves publicas do Supabase — ja vao no bundle do front, nao sao segredo.
          VITE_SUPABASE_URL: https://yomipdpqjwdvohscuxfp.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlvbWlwZHBxandkdm9oc2N1eGZwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg0Nzc2NjYsImV4cCI6MjEwNDA1MzY2Nn0.YO_9dfrBpuZYT-8r1dnGoLA8rHKJEa-E7Y227laux9k

      - name: Deploy (Cloudflare Pages)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=bistropaidegua --branch=main --commit-dirty=true
